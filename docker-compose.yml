version: '3.8'

services:
  api:
    build: .
    container_name: pdf_compressor_api
    ports:
      - "8000:8000"
    command: python -m uvicorn api.index:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  streamlit:
    build: .
    container_name: pdf_compressor_streamlit
    ports:
      - "8501:8501"
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped
